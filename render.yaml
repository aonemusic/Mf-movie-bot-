services:
  - type: web
    name: mf-movie-bot
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: TELEGRAM_SOURCE_CHATS
        sync: false
      - key: APPROVED_DESTINATION_CHANNEL_IDS
        sync: false
      - key: DESTINATION_CHANNEL_ID
        sync: false
      - key: AUTO_FORWARD_NEW
        value: "true"
      - key: FORCE_JOIN_CHANNEL_ID
        sync: false
      - key: FORCE_JOIN_CHANNEL_URL
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: BOT_WEBHOOK_SECRET
        sync: false
      - key: LOG_LEVEL
        value: INFO
